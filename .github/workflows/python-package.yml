---
name: Python package

on:
  push:
    branches: [ "stable" ]
  pull_request:
    branches: [ "stable" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["2.7", "3.9", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip wheel
        python -m pip install --requirement test-requirements.txt
        python -m pip install --editable .[tests]
    - name: Lint with pylint and pyflakes
      run: |
        pylint --errors-only spreadflow_core
        pyflakes spreadflow_core
    - name: Test with trial
      run: |
        COVERAGE_PROCESS_START=`pwd`/.coveragerc trial spreadflow_core
        coverage combine `pwd` `pwd`/_trial_temp
